<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Memes</title>
</head>
<body>

  <h1>Generador de Memes con IA</h1>

  <input
    id="texto"
    placeholder="Describe tu meme"
    size="40"
  >
  <button onclick="generar()">Generar</button>

  <p id="estado"></p>

  <img
    id="imagen"
    width="400"
    style="display:none; margin-top:10px;"
  >

  <script>
    async function generar() {
      const estado = document.getElementById("estado");
      const imagen = document.getElementById("imagen");
      const texto = document.getElementById("texto").value.trim();

      imagen.style.display = "none";

      if (!texto) {
        estado.innerText = "❌ Escribe una descripción primero";
        return;
      }

      estado.innerText = "Generando... ⏳";

      try {
        const r = await fetch("/api/generar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt: texto })
        });

        const data = await r.json();

        if (!r.ok) {
          estado.innerText = "❌ " + (data.error || "Error desconocido");
          return;
        }

        imagen.src = data.url;
        imagen.style.display = "block";
        estado.innerText = "¡Listo! 🎉";

      } catch (e) {
        estado.innerText = "❌ Error de conexión";
        console.error(e);
      }
    }
  </script>

</body>
</html>
