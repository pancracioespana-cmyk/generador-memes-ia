<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Generador de Memes</title>
</head>
<body>
  <h1>Generador de Memes con IA</h1>

  <input id="texto" placeholder="Describe tu meme" size="40">
  <button onclick="generar()">Generar</button>

  <p id="estado"></p>
  <img id="imagen" width="400" alt="Aquí aparecerá tu meme">

  <script>
    async function generar() {
      const estado = document.getElementById("estado");
      const texto = document.getElementById("texto").value;
      const imagen = document.getElementById("imagen");

      estado.innerText = "Generando...";
      imagen.src = "";

      try {
        const r = await fetch("/api/generar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ descripcion: texto })
        });

        const data = await r.json();

        imagen.src = data.imageUrl; // 👈 CLAVE
        estado.innerText = "¡Listo!";
      } catch (error) {
        estado.innerText = "Error al generar la imagen 😢";
        console.error(error);
      }
    }
  </script>
</body>
</html>
